var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

let INGRESO_DATA = {};
async function decompressB64(b64){
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
  w.write(bytes);w.close();
  const out=[],r=ds.readable.getReader();
  while(true){const{value,done}=await r.read();if(done)break;out.push(value);}
  const tot=out.reduce((a,b)=>a+b.length,0),m=new Uint8Array(tot);
  let off=0;for(const c of out){m.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(m));
}

const LS_INGRESO = 'catalogo_maestro_ingreso_v1';
let ING_STATE = {};
let ING_DATE = localStorage.getItem('catalogo_maestro_ing_fecha_v1') || null;
function loadIngresoLS(){ try{ const r = localStorage.getItem(LS_INGRESO); if(r) ING_STATE = JSON.parse(r); }catch(e){} }
function saveIngresoLS(){ localStorage.setItem(LS_INGRESO, JSON.stringify(ING_STATE)); }
function migrarIngresoAClaveCompuesta(){
  let cambios = false;
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    const items = day.items || {};
    const nuevos = {};
    const usados = new Set();
    Object.entries(items).forEach(([key, entry])=>{
      // ya migrado a la version con entregaId real que existe en INGRESO_DATA de esta fecha
      if(entry.entregaId && (INGRESO_DATA[fecha]||[]).some(x=>x.id===entry.entregaId)){
        nuevos[entry.entregaId] = entry; usados.add(entry.entregaId); return;
      }
      // determinar codigo/oc segun el formato de la clave vieja
      let codigo = entry.codigo, oc = entry.oc;
      if(codigo===undefined){
        if(key.includes('||')){ const parts = key.split('||'); codigo = parts[0]; oc = parts[1]; }
        else { codigo = key; }
      }
      // buscar la entrega real de INGRESO_DATA que corresponda (primera libre con ese codigo/oc)
      const candidatos = (INGRESO_DATA[fecha]||[]).filter(x=>x.codigo===codigo && (oc===undefined || oc==='' || x.oc===oc) && !usados.has(x.id));
      const target = candidatos[0] || (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===codigo && !usados.has(x.id));
      const entregaId = target ? target.id : key;
      entry.entregaId = entregaId;
      entry.codigo = codigo;
      entry.oc = target ? target.oc : oc;
      nuevos[entregaId] = entry;
      usados.add(entregaId);
      cambios = true;
    });
    day.items = nuevos;
  });
  if(cambios) saveIngresoLS();
}

let KARDEX = {};

function saveKardexLS(){ localStorage.setItem(LS_KARDEX, JSON.stringify(KARDEX)); }

let ACTIVITY_LOG = [];
function loadActivityLog(){ try{ const r = localStorage.getItem(LS_ACTLOG); if(r) ACTIVITY_LOG = JSON.parse(r); }catch(e){} }
function saveActivityLog(){ localStorage.setItem(LS_ACTLOG, JSON.stringify(ACTIVITY_LOG.slice(0,150))); }
function logActividad(resumen, ts){
  ACTIVITY_LOG.unshift({ts: ts || new Date().toISOString(), resumen});
  ACTIVITY_LOG = ACTIVITY_LOG.slice(0,150);
  saveActivityLog();
}
function addKardexMovimiento(codigo, tipo, cantidad, motivo, fecha, srv, prep){
  const arr = KARDEX[codigo] || (KARDEX[codigo] = []);
  const mov = {fecha: fecha || new Date().toISOString().slice(0,10), tipo, cantidad: parseFloat(cantidad), motivo: motivo||'', srv: srv||'', prep: prep||'', _syncId: Date.now()+'_'+Math.random().toString(36).slice(2)};
  arr.unshift(mov);
  saveKardexLS();
  pushEvento('movimiento', {codigo, mov});
  const it = CATALOG.find(i=>i.id===codigo);
  logActividad((tipo==='devolucion'?'Devolucion registrada: ':'Pedido adicional: ')+(it?it.nombre:codigo)+' — '+cantidad+(it?' '+it.unidad:''));
}
function eliminarMovimiento(codigo, syncId){
  if(!confirm('¿Eliminar este movimiento? Esta accion no se puede deshacer.')) return;
  const arr = KARDEX[codigo] || [];
  const idx = arr.findIndex(m=>m._syncId===syncId);
  if(idx===-1){ toast('No se encontro el movimiento'); return; }
  const mov = arr[idx];
  arr.splice(idx,1);
  saveKardexLS();
  pushEvento('movimiento_borrado', {codigo, syncId});
  const it = CATALOG.find(i=>i.id===codigo);
  logActividad('Movimiento eliminado: '+(mov.tipo==='devolucion'?'Devolucion':'Pedido adicional')+' de '+(it?it.nombre:codigo)+' — '+mov.cantidad);
  toast('Movimiento eliminado');
}
function prepsForProduct(codigo, fecha){
  const day = SAL_DOSIF[fecha] || {};
  const out = [];
  SRV_ORD.forEach(srv=>{
    if(!day[srv]) return;
    Object.entries(day[srv]).forEach(([prep, prods])=>{
      const m = prods.find(p=>p.cod===codigo);
      if(m) out.push({srv, prep, cantidad: m.c, um: m.m});
    });
  });
  return out;
}
function allPrepsForDate(fecha){
  const day = SAL_DOSIF[fecha] || {};
  const out = [];
  SRV_ORD.forEach(srv=>{
    if(!day[srv]) return;
    Object.keys(day[srv]).forEach(prep=>out.push({srv, prep}));
  });
  return out;
}

function drawQR(el, text){
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    el.src = qr.createDataURL(4, 8);
  }catch(e){ console.error('QR error', e); }
}

function renderCatalogo(){
  let h = pageHead('Catalogo maestro', `${CATALOG.length} productos con codigo QR (basado en el codigo interno de dosificacion). Click en un producto para ver su ficha.`,
    `<div class="bar"><div class="sw"><input placeholder="Buscar producto..." value="${ev(SQ)}" oninput="SQ=this.value.toLowerCase();renderCatalogo()"></div></div>`);
  const filtered = CATALOG.filter(i=>!SQ || i.nombre.toLowerCase().includes(SQ));
  if(!filtered.length){ h += `<div class="empty"><div class="ei2">&#128269;</div><div class="et">Sin resultados</div></div>`; document.getElementById('mainArea').innerHTML = h; return; }
  h += '<div class="grid" id="catGrid">';
  filtered.forEach(it=>{
    h += `<div class="pcard" onclick="showFicha('${ev(it.id)}')">
      <span class="badge ${it.fuente}">${it.fuente==='ambos'?'INGRESO + SALIDA':'SOLO SALIDA'}</span>
      <img class="qr-img" data-text="KDX:${ev(it.id)}">
      <div class="pn">${ev(it.nombre)}</div>
      <div class="pid">${it.id}</div>
    </div>`;
  });
  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
  document.querySelectorAll('#catGrid img.qr-img').forEach(c=>drawQR(c, c.dataset.text));
}

function calcularSaldo(codigo){
  const inicial = STOCK_INICIAL[codigo]?.stock;
  let saldo = inicial || 0;
  let tieneBase = inicial != null;
  // + Ingresos confirmados (OK) - puede haber varias entregas (distintas OC/entregas) el mismo dia
  Object.values(ING_STATE).forEach(day=>{
    Object.entries(day.items||{}).forEach(([key,e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(entryCodigo===codigo && e.state==='ok' && e.rec!=null) saldo += e.rec;
    });
  });
  // - Salidas confirmadas (buscando por codigo dentro de SAL_DOSIF)
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod && prod.cod===codigo) saldo -= entry.rec;
    });
  });
  // + Devoluciones, - Pedidos adicionales
  (KARDEX[codigo]||[]).forEach(m=>{
    if(m.tipo==='devolucion') saldo += m.cantidad;
    else if(m.tipo==='adicional') saldo -= m.cantidad;
  });
  return {saldo, tieneBase};
}
function construirKardexLedger(codigo){
  const movs = [];
  // Ingresos confirmados
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(entryCodigo===codigo && e.state==='ok' && e.rec!=null){
        movs.push({fecha, ref: e.fechaReposicion?'REPOSICION':'INGRESO', entrada: e.rec, salida: 0, hora: e.horaOK||'', prioridad:0, tipo:'ingreso', entregaId:key});
      }
    });
  });
  // Salidas confirmadas (buscando el codigo dentro de SAL_DOSIF)
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod && prod.cod===codigo){
        movs.push({fecha, ref: (srv||'').slice(0,3).toUpperCase(), entrada: 0, salida: entry.rec, hora: entry.hora||'', prioridad:1});
      }
    });
  });
  // Devoluciones y Pedidos adicionales
  (KARDEX[codigo]||[]).forEach(m=>{
    if(m.tipo==='devolucion') movs.push({fecha: m.fecha, ref:'DEVOLUCION', entrada: m.cantidad, salida: 0, hora:'', prioridad:2, tipo:'devolucion', syncId:m._syncId});
    else if(m.tipo==='adicional') movs.push({fecha: m.fecha, ref:'PEDIDO ADICIONAL', entrada: 0, salida: m.cantidad, hora:'', prioridad:3, tipo:'adicional', syncId:m._syncId});
  });
  movs.sort((a,b)=> a.fecha!==b.fecha ? a.fecha.localeCompare(b.fecha) : (a.prioridad!==b.prioridad ? a.prioridad-b.prioridad : a.hora.localeCompare(b.hora)));
  let saldo = STOCK_INICIAL[codigo]?.stock || 0;
  const rows = [];
  if(STOCK_INICIAL[codigo]){
    rows.push({fecha: STOCK_INICIAL[codigo].fecha, ref:'INVENTARIO INICIAL', entrada:'-', salida:'-', saldo: saldo.toFixed(3)});
  }
  movs.forEach(m=>{
    saldo = saldo + m.entrada - m.salida;
    rows.push({fecha: m.fecha, ref: m.ref, entrada: m.entrada||'-', salida: m.salida||'-', saldo: saldo.toFixed(3), tipo:m.tipo, syncId:m.syncId, entregaId:m.entregaId});
  });
  return rows;
}
function renderKardexHist(codigo, opts){
  opts = opts || {};
  const rows = construirKardexLedger(codigo);
  if(!rows.length) return '<div class="ing-meta" style="margin-top:8px">Aun sin movimientos registrados.</div>';
  const list = opts.limit ? rows.slice(-opts.limit) : rows;
  let h = `<div style="max-height:${opts.maxHeight||'260px'};overflow-y:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:11px">

      <td style="padding:5px 6px">${ev(r.ref)}${btn}</td>
      <td style="padding:5px 6px;text-align:right;color:var(--ok)">${r.entrada}</td>
      <td style="padding:5px 6px;text-align:right;color:var(--dg)">${r.salida}</td>
      <td style="padding:5px 6px;text-align:right;font-weight:700">${r.saldo}</td>

  });
  h += '</tbody></table></div>';
  return h;

function nearestFechaConDosif(fecha){
  const fechas = Object.keys(SAL_DOSIF).sort();
  if(!fechas.length) return null;
  const after = fechas.find(f=>f>=fecha);
  const before = [...fechas].reverse().find(f=>f<=fecha);
  if(after && before) return (Math.abs(new Date(after)-new Date(fecha)) <= Math.abs(new Date(fecha)-new Date(before))) ? after : before;
  return after || before;
}

function resolveCode(raw){

}
function submitManualCode(){

  if(it){ pushRecent(it.id); showFicha(it.id); document.getElementById('manualCode').value=''; }

async function toggleScan(){
  if(scanStream){ stopScan(); return; }
  const video = document.getElementById('scanVideo');
  const btn = document.getElementById('scanToggleBtn');
  const msg = document.getElementById('scanMsg');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = scanStream;
    await video.play();
    btn.innerHTML = '&#9632; Detener camara';
    msg.textContent = 'Buscando codigo QR...';
    scanCooldown = false;
    scanLoop();
  }catch(e){
    msg.textContent = 'No se pudo acceder a la camara. Usa la busqueda manual.';
    toast('Camara no disponible: '+e.message);
  }
}
function stopScan(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  if(scanRAF) cancelAnimationFrame(scanRAF);
  const btn = document.getElementById('scanToggleBtn');
  if(btn) btn.innerHTML = '&#128247; Iniciar camara';
  const msg = document.getElementById('scanMsg');
  if(msg) msg.textContent = 'Toca "Iniciar camara" para comenzar';
}
function scanLoop(){
  const video = document.getElementById('scanVideo');
  if(!video || !scanStream) return;
  const canvas = document.createElement('canvas');
  const tick = ()=>{
    if(!scanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(img.data, img.width, img.height);
      if(code && code.data && !scanCooldown){
        const it = resolveCode(code.data);
        const frame = document.getElementById('scanFrame');
        if(it){
          scanCooldown = true;
          if(frame) frame.classList.add('hit');
          const msg = document.getElementById('scanMsg');
          if(msg) msg.textContent = 'Encontrado: '+it.nombre;
          pushRecent(it.id);
          setTimeout(()=>{ showFicha(it.id); if(frame) frame.classList.remove('hit'); scanCooldown=false; }, 350);
        }
      }
    }
    scanRAF = requestAnimationFrame(tick);
  };
  scanRAF = requestAnimationFrame(tick);
}

const LS_SALIDA = 'catalogo_maestro_salida_v1';
let SAL_DOSIF = {};
let SAL_STATE = {};
let SAL_DATE = localStorage.getItem('catalogo_maestro_sal_fecha_v1') || null;
const SRV_ORD = ['DESAYUNO','ALMUERZO','CENA'];
function loadSalidaLS(){ try{ const r = localStorage.getItem(LS_SALIDA); if(r) SAL_STATE = JSON.parse(r); }catch(e){} }
function saveSalidaLS(){ localStorage.setItem(LS_SALIDA, JSON.stringify(SAL_STATE)); }
function salK(s,p,n){ return s+'||'+p+'||'+n; }
function salApsFor(d){
  const ps=[], day=SAL_DOSIF[d]||{};
  SRV_ORD.forEach(s=>{ if(!day[s]) return; Object.entries(day[s]).forEach(([p,prds])=>prds.forEach(pr=>ps.push({s,p,pr}))); });
  return ps;
}

function salConfirmarOK(d,s,p,nb,cantidad){
  if(!SAL_STATE[d]) SAL_STATE[d] = {items:{}};
  const hora = new Date().toTimeString().slice(0,5);
  SAL_STATE[d].items[salK(s,p,nb)] = {rec: cantidad, hora};
  saveSalidaLS();
  pushEvento('salida_ok', {fecha:d, s, p, nb, cantidad, hora});
  logActividad('Salida confirmada: '+nb+' ('+p+') — '+cantidad);
  render();
  toast('Salida confirmada ('+hora+')');

// ===================== MODULO DISTRIBUCION =====================
// Pensado para perecibles (verduras, frutas, carnicos, embutidos, huevos):
// se trabaja por ENTREGA DEL DIA (ej. "hoy llegaron 70kg de ajo") en vez de
// por saldo acumulado del producto. Cada entrega confirmada en Ingreso es su
// propio presupuesto: se distribuye solo entre las preparaciones que esos
// kilos alcanzan a cubrir, en orden cronologico (y dentro del mismo dia, en
// orden Desayuno -> Almuerzo -> Cena). Al distribuir, la salida queda
// confirmada de una vez (mismo SAL_STATE que usa el modulo de Salida), y se
// guarda tambien QUE items concretos se asignaron a esta entrega, para poder
// mostrarlos siempre (con boton de Deshacer) en vez de que desaparezcan.
const DISTRIB_RUBROS = ['CARNE DE AVES','CARNE DE CERDO','CARNE DE PESCADO','CARNE DE RES','EMBUTIDOS Y LACTEOS','FRUTA','HUEVOS','VERDURAS Y TUBERCULOS'];
const SRV_ORDEN_IDX = {DESAYUNO:0, ALMUERZO:1, CENA:2};
let DISTRIB_DATE = null;
let DISTRIB_SEL = null; // {fechaEntrega, entregaId}
let DISTRIB_VISTA = 'accion'; // 'accion' | 'resumen'
function fechasConEntregaDistrib(){
  return fechasConEntrega().filter(f=>{
    return (INGRESO_DATA[f]||[]).some(it=>{
      const e = ingEntry(f, it.id);
      if(e?.state!=='ok') return false;
      const cat = CATALOG.find(c=>c.id===it.codigo);
      return cat && DISTRIB_RUBROS.includes(cat.rubro);
    });
  });
}
function nextFechaConEntregaDistrib(dir){
  const fechas = fechasConEntregaDistrib();
  if(!fechas.length) return DISTRIB_DATE;
  const hoy = new Date().toISOString().slice(0,10);
  const base = DISTRIB_DATE || hoy;
  if(dir>0){ return fechas.find(f=>f>base) || fechas[fechas.length-1]; }
  else { return [...fechas].reverse().find(f=>f<base) || fechas[0]; }
}
function setDistribDate(v){ DISTRIB_DATE = v; DISTRIB_SEL = null; render(); }
// Se calcula en vivo leyendo directamente el estado real de Salida (salIst),
// sin llevar un registro aparte — asi no importa si una preparacion se
// confirmo desde este modulo o desde el modulo de Salida normal: siempre
// se refleja igual.
function itemsCodigoDesde(codigo, fechaMin){
  const out = [];
  Object.keys(SAL_DOSIF).sort().forEach(fecha=>{
    if(fecha < fechaMin) return;
    const day = SAL_DOSIF[fecha];
    SRV_ORD.forEach(turno=>{
      if(!day[turno]) return;
      Object.entries(day[turno]).forEach(([prep,prods])=>{
        prods.forEach(p=>{
          if(p.cod===codigo){
            out.push({fecha,turno,prep,nombre:p.n,cantidad:p.c,medida:p.m,
              estado: salIst(fecha,turno,prep,p)==='ok' ? 'ok' : 'pendiente'});
          }
        });
      });
    });
  });
  return out; // ya ordenado por fecha y por turno (Desayuno->Almuerzo->Cena)
}
// Entregas confirmadas de un dia, solo rubros perecibles, con lo ya
// distribuido y lo restante (calculado en vivo, ver planEntrega).
function entregasDelDia(fecha){
  return (INGRESO_DATA[fecha]||[]).map(it=>{
    const e = ingEntry(fecha, it.id);
    const cat = CATALOG.find(c=>c.id===it.codigo);
    return {it, e, cat};
  }).filter(x=>x.e?.state==='ok' && x.cat && DISTRIB_RUBROS.includes(x.cat.rubro))
    .map(x=>{
      const {distribuido, restante} = planEntrega(fecha, x.it.id);
      return {...x, distribuido, restante};
    });
}
// Plan de una entrega: TODAS las preparaciones de este codigo desde la
// fecha de la entrega en adelante (confirmadas o no), tomando tantas como
// el monto recibido alcance a cubrir, en orden cronologico. Lo que ya este
// confirmado en Salida (por cualquier via) cuenta como "distribuido"; lo
// que no, queda disponible para distribuir desde aqui.
function planEntrega(fechaEntrega, entregaId){
  const it = (INGRESO_DATA[fechaEntrega]||[]).find(x=>x.id===entregaId);
  const e = ingEntry(fechaEntrega, entregaId);
  if(!it || e?.state!=='ok') return {it:null};
  const todas = itemsCodigoDesde(it.codigo, fechaEntrega);
  let acumulado = 0;
  const plan = [];
  for(const x of todas){
    if(acumulado + x.cantidad > e.rec + 0.0001) break;
    acumulado += x.cantidad;
    plan.push(x);
  }
  const distribuido = plan.filter(x=>x.estado==='ok').reduce((s,x)=>s+x.cantidad,0);
  const restante = Math.max(0, e.rec - distribuido);
  const primerPendiente = todas[plan.length] || null;
  return {it, e, distribuido, restante, plan, primerPendiente};
}
function abrirDistrib(fecha, entregaId){ DISTRIB_SEL = {fechaEntrega:fecha, entregaId}; DISTRIB_VISTA='accion'; render(); }

  const entregas = entregasDelDia(DISTRIB_DATE);
  let h = pageHead('Distribucion de perecibles',

  const tabs = `<div class="bar" style="margin-bottom:10px">

    h += `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--s2)">

    distribuidos.forEach(x=>{

  plan.forEach(x=>{
    const done = x.estado==='ok';

function distribuirTodoLoQueAlcance(fechaEntrega, entregaId){
  const it = (INGRESO_DATA[fechaEntrega]||[]).find(x=>x.id===entregaId);

function stockDisponible(codigo){
  if(!codigo) return null;
  const {saldo, tieneBase} = calcularSaldo(codigo);
  return {saldo, tieneBase};
}
// Calcula el saldo de TODOS los codigos en una sola pasada por el historial,
// en vez de recorrer todo el historial una vez por cada producto (que era
// lo que colgaba la app en dispositivos menos potentes tras semanas de uso).
function calcularTodosLosSaldos(){
  const mapa = {};
  const get = codigo => mapa[codigo] || (mapa[codigo] = {saldo: (STOCK_INICIAL[codigo]?.stock)||0, tieneBase: STOCK_INICIAL[codigo]!=null});
  Object.values(ING_STATE).forEach(day=>{
    Object.entries(day.items||{}).forEach(([key,e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(e.state==='ok' && e.rec!=null) get(entryCodigo).saldo += e.rec;
    });
  });
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod) get(prod.cod).saldo -= entry.rec;
    });
  });
  Object.entries(KARDEX).forEach(([codigo, movs])=>{
    (movs||[]).forEach(m=>{
      if(m.tipo==='devolucion') get(codigo).saldo += m.cantidad;
      else if(m.tipo==='adicional') get(codigo).saldo -= m.cantidad;
    });
  });
  return mapa;
}

function salExportCSV(){

function exportIngresoXLSX(fecha){

  const header = [
    [null,'ÁREA DE ALMACÉN',null,null,null,null,null,null,null,'Código: FM - AL - 03',null],
    [null,null,null,null,null,null,null,null,null,'Versión: 00',null],

    [null,null,null,null,null,null,null,null,null,'Página: 1 de 1',null],

  ];

    return [fecha, it.proveedor||'', it.nombre, it.um||'', it.cantidad, precio, totalOC, horaCol, ingresoCol, faltanteCol, reposicionCol];
  });
  const ws = XLSX.utils.aoa_to_sheet(header.concat(rows));

  toast('Exportado: '+items.length+' productos');
}
function ingEntry(fecha, entregaId){ return ING_STATE[fecha]?.items?.[entregaId] || null; }
function ingCompletarParcial(fecha, entregaId, uid){
  const v = parseFloat(document.getElementById('iq-'+uid)?.value);
  if(isNaN(v)||v<0){ toast('Ingresa una cantidad valida'); return; }
  const prev = ING_STATE[fecha]?.items?.[entregaId];
  if(!prev){ toast('No se encontro el registro original'); return; }
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  const entry = {entregaId, codigo: infoIt?infoIt.codigo:prev.codigo, oc: infoIt?infoIt.oc:prev.oc, rec: (prev.rec||0)+v, state:'ok', horaOK: new Date().toTimeString().slice(0,5), fechaReposicion: new Date().toISOString().slice(0,10), faltanteOriginal: prev.faltanteParcial || prev.faltanteOriginal};
  ING_STATE[fecha].items[entregaId] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, entregaId, entry});
  logActividad('Ingreso completado: '+(infoIt?infoIt.nombre:entregaId)+' — se agrego '+v+' (total: '+entry.rec+')');
  renderFaltantes();
  toast('Ingreso completado');
}
function ingConfirmarOK(fecha, entregaId, uid){
  const v = parseFloat(document.getElementById('iq-'+uid)?.value);
  if(isNaN(v)||v<0){ toast('Ingresa una cantidad valida'); return; }
  if(!ING_STATE[fecha]) ING_STATE[fecha]={items:{}};
  const prev = ING_STATE[fecha].items[entregaId];
  const hora = new Date().toTimeString().slice(0,5);
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  const esperado = infoIt ? infoIt.cantidad : null;
  const entry = {entregaId, codigo: infoIt?infoIt.codigo:prev?.codigo, oc: infoIt?infoIt.oc:prev?.oc, rec: v, state:'ok', horaOK: hora};
  if(esperado!=null && v < esperado - 0.001){
    entry.faltanteParcial = +(esperado - v).toFixed(3);
  }
  if(prev && prev.state==='pendiente'){
    entry.fechaReposicion = new Date().toISOString().slice(0,10);
    entry.obs = prev.obs || '';
  } else if(prev && prev.faltanteParcial && !entry.faltanteParcial){
    entry.fechaReposicion = new Date().toISOString().slice(0,10);
    entry.faltanteOriginal = prev.faltanteParcial;
  }
  ING_STATE[fecha].items[entregaId] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, entregaId, entry});
  logActividad('Ingreso confirmado: '+(infoIt?infoIt.nombre:entregaId)+' — '+v+(entry.faltanteParcial?(' (faltante parcial: '+entry.faltanteParcial+')'):'')+(entry.fechaReposicion?' (reposicion de faltante)':''));
  renderIngreso();
  toast(entry.faltanteParcial ? ('Ingreso parcial — faltan '+entry.faltanteParcial) : ('Ingreso confirmado ('+hora+')'));
}
function ingMarcarPendiente(fecha, entregaId){
  const obs = prompt('Observacion (opcional): motivo por el que no ingreso (rechazado, no lo trajo el proveedor, etc.)') || '';
  if(!ING_STATE[fecha]) ING_STATE[fecha]={items:{}};
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  const entry = {entregaId, codigo: infoIt?infoIt.codigo:null, oc: infoIt?infoIt.oc:null, rec:null, state:'pendiente', obs};

function ingDeshacer(fecha, entregaId){
  if(ING_STATE[fecha]?.items?.[entregaId]) delete ING_STATE[fecha].items[entregaId];
  saveIngresoLS();
  pushEvento('ingreso_undo', {fecha, entregaId});
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:entregaId));

function todosLosFaltantes(){
  const out = [];
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.state==='pendiente' || entry.fechaReposicion || entry.faltanteParcial){
        const entregaId = entry.entregaId || key;
        const info = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId) ||
                     (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===(entry.codigo||key.split('||')[0]));
        out.push({fecha, entregaId, codigo: entry.codigo||(info?info.codigo:key), oc: entry.oc, entry,
                   nombre: info?info.nombre:(entry.codigo||key), proveedor: info?info.proveedor:'', esperado: info?info.cantidad:null, um: info?info.um:''});
      }
    });
  });
  out.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return out;
}
function ordenarPorOCyNombre(items){
  return items.slice().sort((a,b)=>{
    const ocA = parseInt((a.oc||'').match(/\d+/)?.[0] || '999999', 10);
    const ocB = parseInt((b.oc||'').match(/\d+/)?.[0] || '999999', 10);
    if(ocA !== ocB) return ocA - ocB;
    return (a.nombre||'').localeCompare(b.nombre||'', 'es');
  });
}

  renderStats();
  document.getElementById('nav-ingreso').className = 'navb'+(TAB==='ingreso'?' on':'');
  document.getElementById('nav-salida').className = 'navb'+(TAB==='salida'?' on':'');
  document.getElementById('nav-distrib').className = 'navb'+(TAB==='distrib'?' on':'');
  document.getElementById('nav-movimientos').className = 'navb'+(TAB==='movimientos'?' on':'');

  else if(TAB==='ingreso') renderIngreso();

const CONF_KEY = 'catalogo_maestro_syncurl_v1';
let SYNC_URL = localStorage.getItem(CONF_KEY) || '';
let LAST_EVENT_IDS = new Set(JSON.parse(localStorage.getItem('lastEventIds')||'[]'));
let LAST_SYNC_TIME = null;
let SYNC_BUSY = false;
function saveLastEventIds(){
  // Conserva solo los ultimos 5000 ids para que este archivo no crezca sin limite.
  const arr = Array.from(LAST_EVENT_IDS);
  const trimmed = arr.length>5000 ? arr.slice(arr.length-5000) : arr;
  try{ localStorage.setItem('lastEventIds', JSON.stringify(trimmed)); }catch(e){}
}

function guardarSyncUrl(){
  const v = document.getElementById('syncUrlInput')?.value.trim();
  if(!v){ toast('Pega la URL del script primero'); return; }
  SYNC_URL = v;
  localStorage.setItem(CONF_KEY, SYNC_URL);
  toast('URL guardada, sincronizando...');
  pullEventos();
  renderSync();
}
function quitarSyncUrl(){
  SYNC_URL = '';
  localStorage.removeItem(CONF_KEY);
  renderSync();
  toast('Sincronizacion desactivada en este dispositivo');
}
function resincronizarTodo(){
  if(!SYNC_URL){ toast('Configura primero la URL de sincronizacion'); return; }
  if(!confirm('Esto va a revisar TODO el historial del servidor de nuevo y corregir cualquier diferencia en ESTE dispositivo (no borra nada, solo empareja). Puede tardar unos segundos. ¿Continuar?')) return;
  LAST_EVENT_IDS = new Set();
  saveLastEventIds();
  toast('Revisando todo el historial...');
  pullEventos(true);
}
async function pushEvento(tipo, payload){
  if(!SYNC_URL) return;
  const id = Date.now()+'_'+Math.random().toString(36).slice(2);
  LAST_EVENT_IDS.add(id);
  saveLastEventIds();
  try{
    await fetch(SYNC_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({id, tipo, payload})
    });
  }catch(e){ console.error('sync push error', e); }
}
function aplicarEventoRemoto(tipo, p, DIRTY){
  if(tipo==='salida_ok'){
    if(!SAL_STATE[p.fecha]) SAL_STATE[p.fecha] = {items:{}};
    SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb)] = {rec:p.cantidad, hora:p.hora};
    DIRTY.salida = true;
    logActividad('Salida confirmada: '+p.nb+' ('+p.p+') — '+p.cantidad);
  } else if(tipo==='salida_undo'){
    if(SAL_STATE[p.fecha]?.items) delete SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb)];
    DIRTY.salida = true;
    logActividad('Salida deshecha: '+p.nb);
  } else if(tipo==='ingreso_set'){
    if(!ING_STATE[p.fecha]) ING_STATE[p.fecha] = {items:{}};
    ING_STATE[p.fecha].items[p.entregaId] = p.entry;
    DIRTY.ingreso = true;
    const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.id===p.entregaId);
    const nom = infoIt?infoIt.nombre:p.entregaId;
    logActividad(p.entry.state==='ok' ? ('Ingreso confirmado: '+nom+' — '+p.entry.rec+(p.entry.fechaReposicion?' (reposicion de faltante)':'')) : ('Ingreso pendiente/faltante: '+nom));
  } else if(tipo==='ingreso_undo'){
    if(ING_STATE[p.fecha]?.items) delete ING_STATE[p.fecha].items[p.entregaId];
    DIRTY.ingreso = true;
    const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.id===p.entregaId);
    logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:p.entregaId));
  } else if(tipo==='movimiento'){
    const arr = KARDEX[p.codigo] || (KARDEX[p.codigo] = []);
    if(!arr.some(m=>m._syncId===p.mov._syncId)){
      arr.unshift(p.mov);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad((p.mov.tipo==='devolucion'?'Devolucion registrada: ':'Pedido adicional: ')+(it?it.nombre:p.codigo)+' — '+p.mov.cantidad);
    }
    DIRTY.kardex = true;
  } else if(tipo==='movimiento_borrado'){
    const arr = KARDEX[p.codigo] || [];
    const idx = arr.findIndex(m=>m._syncId===p.syncId);
    if(idx!==-1){
      const mov = arr[idx];
      arr.splice(idx,1);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad('Movimiento eliminado: '+(mov.tipo==='devolucion'?'Devolucion':'Pedido adicional')+' de '+(it?it.nombre:p.codigo)+' — '+mov.cantidad);
    }
    DIRTY.kardex = true;
  }
}
async function pullEventos(manual){
  if(!SYNC_URL || SYNC_BUSY) return;
  SYNC_BUSY = true;
  try{
    const res = await fetch(SYNC_URL+'?t='+Date.now());
    const data = await res.json();
    if(data.ok){
      let nuevos = 0;
      const DIRTY = {salida:false, ingreso:false, kardex:false};
      data.eventos.forEach(evt=>{
        if(LAST_EVENT_IDS.has(evt.id)) return;
        LAST_EVENT_IDS.add(evt.id);
        try{ aplicarEventoRemoto(evt.tipo, JSON.parse(evt.payload), DIRTY); nuevos++; }catch(e){}
      });
      if(DIRTY.salida) saveSalidaLS();
      if(DIRTY.ingreso) saveIngresoLS();
      if(DIRTY.kardex) saveKardexLS();
      if(nuevos>0) saveLastEventIds();
      LAST_SYNC_TIME = new Date();
      if(nuevos>0) render(); else if(TAB==='sync') renderSync();
      if(manual) toast(nuevos>0 ? ('Sincronizado: '+nuevos+' evento(s) nuevo(s)') : 'Ya estaba al dia');
    }
  }catch(e){ console.error('sync pull error', e); if(manual) toast('Error de sincronizacion'); }
  SYNC_BUSY = false;
}
function renderSync(){
  let h = pageHead('Sincronizacion', 'Comparte Salida, Ingreso, Devoluciones y Pedidos Adicionales con otros dispositivos en tiempo real.');
  h += `<div class="sync-card">
    <div><span class="sync-dot ${SYNC_URL?'on':'off'}"></span>${SYNC_URL ? 'Sincronizacion activa en este dispositivo' : 'Sin configurar en este dispositivo'}</div>
    ${LAST_SYNC_TIME ? `<div class="ing-meta" style="margin-top:6px">Ultima sincronizacion: ${LAST_SYNC_TIME.toLocaleTimeString()}</div>` : ''}
    <label style="font-family:var(--mn);font-size:10px;color:var(--mut);text-transform:uppercase;display:block;margin-top:14px">URL del script de Google (termina en /exec)</label>
    <input id="syncUrlInput" placeholder="https://script.google.com/macros/s/..../exec" value="${ev(SYNC_URL)}">
    <div class="dlg-actions">
      <button onclick="guardarSyncUrl()">Guardar y sincronizar</button>
      <button onclick="pullEventos(true)">Sincronizar ahora</button>
      ${SYNC_URL ? '<button onclick="quitarSyncUrl()">Desactivar</button>' : ''}
    </div>
    <div class="dlg-actions">
      <button onclick="probarConexion()">&#129514; Probar conexion (diagnostico)</button>
      ${SYNC_URL ? '<button onclick="resincronizarTodo()">&#128260; Resincronizar todo (corrige diferencias entre dispositivos)</button>' : ''}
    </div>
    <div id="diagBox" style="margin-top:10px"></div>
  </div>`;
  h += `<div class="sync-card" style="margin-top:14px">
    <div style="font-weight:700;margin-bottom:6px">Mantenimiento</div>
    <div class="ing-meta" style="margin-bottom:10px">Revisa ingresos confirmados dos veces para el mismo producto en el mismo dia (puede pasar cuando se corrige el cronograma y un ingreso ya confirmado queda "huerfano" — la persona lo vuelve a confirmar sin saber que ya estaba).</div>
    <div class="dlg-actions">
      <button onclick="renderDiagnosticoDuplicados()">&#128269; Revisar ingresos duplicados</button>
    </div>
    <div id="dupBox" style="margin-top:10px"></div>
  </div>`;
  document.getElementById('mainArea').innerHTML = h;
}
function diagnosticoDuplicadosIngreso(){
  const out = [];
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    const porCodigo = {};
    Object.entries(day.items||{}).forEach(([key, e])=>{
      if(e.state!=='ok' || e.rec==null) return;
      const codigo = e.codigo || key.split('||')[0].split('_')[0];
      (porCodigo[codigo] || (porCodigo[codigo]=[])).push({entregaId:key, rec:e.rec, hora:e.horaOK||''});
    });
    Object.entries(porCodigo).forEach(([codigo, entries])=>{
      if(entries.length>1){
        const cat = CATALOG.find(c=>c.id===codigo);
        const enCronograma = new Set((INGRESO_DATA[fecha]||[]).map(x=>x.id));
        out.push({
          fecha, codigo, nombre: cat?cat.nombre:codigo,
          entries: entries.map(en=>({...en, huerfano: !enCronograma.has(en.entregaId)}))
        });
      }
    });
  });
  return out.sort((a,b)=> a.fecha.localeCompare(b.fecha));
}
function renderDiagnosticoDuplicados(){
  const box = document.getElementById('dupBox');
  const casos = diagnosticoDuplicadosIngreso();
  if(!casos.length){ box.innerHTML = '<div class="ing-meta" style="color:var(--ok)">No se encontraron ingresos duplicados. Todo en orden.</div>'; return; }
  let h = `<div class="ing-meta" style="margin-bottom:8px"><b>${casos.length} caso(s) encontrado(s).</b> Deja UNA de las lineas de cada caso y deshaz las demas.</div>`;
  casos.forEach(c=>{
    h += `<div class="ing-row" style="display:block">
      <div class="ing-name">${ev(c.nombre)} &middot; ${c.fecha}</div>`;
    c.entries.forEach(en=>{
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd)">
        <div class="ing-meta">Cantidad: ${en.rec} ${en.hora?(' &middot; Hora: '+ev(en.hora)):''} ${en.huerfano?' &middot; <b style="color:var(--dg)">huerfano (ya no esta en el cronograma actual)</b>':''}</div>
        <button class="fc" onclick="deshacerDesdeDiagnostico('${ev(c.fecha)}','${ev(en.entregaId)}')">Deshacer esta</button>
      </div>`;
    });
    h += `</div>`;
  });
  box.innerHTML = h;
}
function deshacerDesdeDiagnostico(fecha, entregaId){
  if(!confirm('¿Deshacer esta confirmacion de ingreso del '+fecha+'? Esta accion no se puede deshacer.')) return;
  ingDeshacer(fecha, entregaId);
  renderDiagnosticoDuplicados();
}
async function probarConexion(){
  const box = document.getElementById('diagBox');
  const url = document.getElementById('syncUrlInput')?.value.trim() || SYNC_URL;
  if(!url){ box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Pega la URL primero.</div>'; return; }
  box.innerHTML = '<div class="ing-meta">Probando...</div>';
  if(!url.includes('/exec')){
    box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>La URL no termina en /exec</b> — parece que pegaste la URL del editor de Apps Script en vez de la URL de la aplicacion web publicada. Ve a Implementar > Gestionar implementaciones para copiar la URL correcta.</div>`;
    return;
  }
  try{
    const res = await fetch(url+'?t='+Date.now());
    const status = res.status;
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(parsed && parsed.ok){
      box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Conexion exitosa.</b> El script respondio correctamente con ${parsed.eventos.length} evento(s) guardado(s) hasta ahora.</div>`;
    } else if(text.includes('Google Apps Script') && text.includes('sign in')){
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>El script pide iniciar sesion.</b> En la implementacion, el permiso "Quien tiene acceso" no esta puesto en "Cualquier usuario". Vuelve a Implementar > Gestionar implementaciones > editar (icono lapiz) > cambia el acceso y vuelve a implementar.</div>`;
    } else if(text.trim().startsWith('<')){
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>El script devolvio una pagina HTML en vez de datos</b> (status ${status}). Esto suele pasar si la implementacion no autorizo permisos, o si el codigo tiene un error. Revisa en Apps Script > Ejecuciones, para ver el detalle del error.</div>`;
    } else {
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)">Respuesta inesperada (status ${status}): ${ev(text.slice(0,200))}</div>`;
    }
  }catch(e){
    box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>No se pudo conectar.</b> Error: ${ev(e.message)}. Revisa que la URL este bien copiada y que tengas internet.</div>`;
  }
}
setInterval(()=>pullEventos(false), 20000);

async function init(){
  loadRecent();
  loadIngresoLS();
  loadKardexLS();
  loadSalidaLS();
  loadActivityLog();
  try{ INGRESO_DATA = await decompressB64(INGRESO_B64); }catch(e){ console.error('No se pudo cargar cronograma de ingreso', e); }
  try{ SAL_DOSIF = await decompressB64(SAL_DOSIF_B64); }catch(e){ console.error('No se pudo cargar dosificacion de salida', e); }
  migrarIngresoAClaveCompuesta();
  render();
  if(SYNC_URL) pullEventos(false);
}
init();
