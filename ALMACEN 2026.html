var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],

<script>
const CATALOG = JSON.parse(document.getElementById('catalogData').textContent);
let INGRESO_DATA = {};
async function decompressB64(b64){
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
  w.write(bytes);w.close();
  const out=[],r=ds.readable.getReader();
  while(true){const{value,done}=await r.read();if(done)break;out.push(value);}
  const tot=out.reduce((a,b)=>a+b.length,0),m=new Uint8Array(tot);
  let off=0;for(const c of out){m.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(m));
}

const LS_INGRESO = 'catalogo_maestro_ingreso_v1';
let ING_STATE = {};
let ING_DATE = null;
function loadIngresoLS(){ try{ const r = localStorage.getItem(LS_INGRESO); if(r) ING_STATE = JSON.parse(r); }catch(e){} }
function saveIngresoLS(){ localStorage.setItem(LS_INGRESO, JSON.stringify(ING_STATE)); }

const LS_KARDEX = 'catalogo_maestro_kardex_v1';
let KARDEX = {};
function loadKardexLS(){ try{ const r = localStorage.getItem(LS_KARDEX); if(r) KARDEX = JSON.parse(r); }catch(e){} }
function saveKardexLS(){ localStorage.setItem(LS_KARDEX, JSON.stringify(KARDEX)); }
const LS_ACTLOG = 'catalogo_maestro_actividad_v1';
let ACTIVITY_LOG = [];
function loadActivityLog(){ try{ const r = localStorage.getItem(LS_ACTLOG); if(r) ACTIVITY_LOG = JSON.parse(r); }catch(e){} }
function saveActivityLog(){ localStorage.setItem(LS_ACTLOG, JSON.stringify(ACTIVITY_LOG.slice(0,150))); }
function logActividad(resumen, ts){
  ACTIVITY_LOG.unshift({ts: ts || new Date().toISOString(), resumen});
  ACTIVITY_LOG = ACTIVITY_LOG.slice(0,150);
  saveActivityLog();
}
function addKardexMovimiento(codigo, tipo, cantidad, motivo, fecha, srv, prep){
  const arr = KARDEX[codigo] || (KARDEX[codigo] = []);
  const mov = {fecha: fecha || new Date().toISOString().slice(0,10), tipo, cantidad: parseFloat(cantidad), motivo: motivo||'', srv: srv||'', prep: prep||'', _syncId: Date.now()+'_'+Math.random().toString(36).slice(2)};
  arr.unshift(mov);
  saveKardexLS();
  pushEvento('movimiento', {codigo, mov});
  const it = CATALOG.find(i=>i.id===codigo);
  logActividad((tipo==='devolucion'?'Devolucion registrada: ':'Pedido adicional: ')+(it?it.nombre:codigo)+' — '+cantidad+(it?' '+it.unidad:''));
}
function prepsForProduct(codigo, fecha){
  const day = SAL_DOSIF[fecha] || {};
  const out = [];
  SRV_ORD.forEach(srv=>{
    if(!day[srv]) return;
    Object.entries(day[srv]).forEach(([prep, prods])=>{
      const m = prods.find(p=>p.cod===codigo);
      if(m) out.push({srv, prep, cantidad: m.c, um: m.m});
    });
  });
  return out;
}
function allPrepsForDate(fecha){
  const day = SAL_DOSIF[fecha] || {};
  const out = [];
  SRV_ORD.forEach(srv=>{
    if(!day[srv]) return;
    Object.keys(day[srv]).forEach(prep=>out.push({srv, prep}));
  });
  return out;
}
const LS_RECENT = 'catalogo_maestro_recientes_v2';
let TAB = 'panel';
let SQ = '';
let RECENT = [];

function ev(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2800);
}
function loadRecent(){ try{ const r = localStorage.getItem(LS_RECENT); if(r) RECENT = JSON.parse(r); }catch(e){} }
function saveRecent(){ localStorage.setItem(LS_RECENT, JSON.stringify(RECENT.slice(0,15))); }
function pushRecent(id){ RECENT = RECENT.filter(x=>x!==id); RECENT.unshift(id); saveRecent(); }

function setTab(t){ TAB = t; render(); }

function drawQR(el, text){
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    el.src = qr.createDataURL(4, 8);
  }catch(e){ console.error('QR error', e); }
}

function calcularSaldo(codigo){
  const inicial = STOCK_INICIAL[codigo]?.stock;
  let saldo = inicial || 0;
  let tieneBase = inicial != null;
  // + Ingresos confirmados (OK)
  Object.values(ING_STATE).forEach(day=>{
    const e = day.items?.[codigo];
    if(e?.state==='ok' && e.rec!=null) saldo += e.rec;
  });
  // - Salidas confirmadas (buscando por codigo dentro de SAL_DOSIF)
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod && prod.cod===codigo) saldo -= entry.rec;
    });
  });
  // + Devoluciones, - Pedidos adicionales
  (KARDEX[codigo]||[]).forEach(m=>{
    if(m.tipo==='devolucion') saldo += m.cantidad;
    else if(m.tipo==='adicional') saldo -= m.cantidad;
  });
  return {saldo, tieneBase};
}
function renderKardexHist(codigo){
  const arr = KARDEX[codigo] || [];
  if(!arr.length) return '<div class="ing-meta" style="margin-top:8px">Aun sin movimientos registrados.</div>';
  let h = '<div class="kardex-hist">';
  arr.slice(0,8).forEach(m=>{
    const lbl = m.tipo==='devolucion' ? 'Devolucion' : 'Pedido adicional';
    const sign = m.tipo==='devolucion' ? '&#8722;' : '&#43;';
    const prepTxt = m.prep ? ` &middot; ${ev(m.srv)} / ${ev(m.prep)}` : '';
    h += `<div class="kh-item"><span>${m.fecha} &middot; ${lbl}${prepTxt}${m.motivo?' &mdash; '+ev(m.motivo):''}</span><span>${sign}${m.cantidad}</span></div>`;
  });
  h += '</div>';
  return h;
}

function nearestFechaConDosif(fecha){
  const fechas = Object.keys(SAL_DOSIF).sort();
  if(!fechas.length) return null;
  const after = fechas.find(f=>f>=fecha);
  const before = [...fechas].reverse().find(f=>f<=fecha);
  if(after && before) return (Math.abs(new Date(after)-new Date(fecha)) <= Math.abs(new Date(fecha)-new Date(before))) ? after : before;
  return after || before;
}
function refreshDlgPreps(codigo, tipo){
  const it = CATALOG.find(i=>i.id===codigo);
  const fecha = document.getElementById('dlgFecha-'+tipo)?.value;
  const wrap = document.getElementById('dlgPrepWrap-'+tipo);
  if(!it || !fecha || !wrap) return;
  const sinDosif = !SAL_DOSIF[fecha] || !Object.keys(SAL_DOSIF[fecha]).length;
  if(sinDosif){
    const cercana = nearestFechaConDosif(fecha);
    wrap.innerHTML = `<div class="ing-meta" style="margin:6px 0;color:var(--dg)">No hay dosificacion programada para el ${ev(fecha)} (sin atencion de comedor ese dia, ej. feriado o receso).${cercana?` La fecha con dosificacion mas cercana es <b>${cercana}</b>.`:''} Puedes registrar el movimiento sin vincularlo a una preparacion.</div>`;
    return;
  }
  const preps = tipo==='adicional' ? allPrepsForDate(fecha) : prepsForProduct(it.id, fecha);
  if(!preps.length){
    wrap.innerHTML = `<div class="ing-meta" style="margin:6px 0">Ese dia hay dosificacion, pero ninguna preparacion usa este producto. Puedes registrar el movimiento sin vincularlo a una preparacion.</div>`;
    return;
  }
  let h = `<label style="font-family:var(--mn);font-size:10px;color:var(--mut);text-transform:uppercase">Preparacion que ${tipo==='devolucion'?'genero la devolucion':'usara el adicional'}</label>
    <select id="dlgPrep-${tipo}">`;
  h += `<option value="">Sin vincular a una preparacion</option>`;
  preps.forEach(p=>{
    const detalle = p.cantidad!=null ? ` (dosificado: ${p.cantidad} ${ev(p.um||'')})` : '';
    h += `<option value="${ev(p.srv)}||${ev(p.prep)}">${ev(p.srv)} &mdash; ${ev(p.prep)}${detalle}</option>`;
  });
  h += `</select>`;
  wrap.innerHTML = h;
}
function toggleDlgForm(codigo, tipo){
  ['devolucion','adicional'].forEach(t=>{
    const el = document.getElementById('dlgForm-'+t);
    if(!el) return;
    if(t===tipo){ el.classList.toggle('show'); if(el.classList.contains('show')) refreshDlgPreps(codigo, tipo); }
    else el.classList.remove('show');
  });
}

let scanStream = null, scanRAF = null, scanCooldown = false;

function renderEscanear(){
  let h = `<div class="pgh"><div class="pgt">Escanear producto</div><div class="pgd">Apunta la camara al codigo QR pegado en el producto para abrir su ficha (Kardex).</div></div>`;

function resolveCode(raw){
  if(!raw) return null;
  let code = raw.trim().toUpperCase().replace(/^KDX:/,'').replace(/\s+/g,'');
  return CATALOG.find(i=>i.id===code) || null;
}
function submitManualCode(){
  const v = document.getElementById('manualCode').value;
  const it = resolveCode(v);
  if(it){ pushRecent(it.id); showFicha(it.id); document.getElementById('manualCode').value=''; }
  else toast('No se encontro ese codigo en el catalogo');
}

async function toggleScan(){
  if(scanStream){ stopScan(); return; }
  const video = document.getElementById('scanVideo');
  const btn = document.getElementById('scanToggleBtn');
  const msg = document.getElementById('scanMsg');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = scanStream;
    await video.play();
    btn.innerHTML = '&#9632; Detener camara';
    msg.textContent = 'Buscando codigo QR...';
    scanCooldown = false;
    scanLoop();
  }catch(e){
    msg.textContent = 'No se pudo acceder a la camara. Usa la busqueda manual.';
    toast('Camara no disponible: '+e.message);
  }
}
function stopScan(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  if(scanRAF) cancelAnimationFrame(scanRAF);
  const btn = document.getElementById('scanToggleBtn');
  if(btn) btn.innerHTML = '&#128247; Iniciar camara';
  const msg = document.getElementById('scanMsg');
  if(msg) msg.textContent = 'Toca "Iniciar camara" para comenzar';
}
function scanLoop(){
  const video = document.getElementById('scanVideo');
  if(!video || !scanStream) return;
  const canvas = document.createElement('canvas');
  const tick = ()=>{
    if(!scanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(img.data, img.width, img.height);
      if(code && code.data && !scanCooldown){
        const it = resolveCode(code.data);
        const frame = document.getElementById('scanFrame');
        if(it){
          scanCooldown = true;
          if(frame) frame.classList.add('hit');
          const msg = document.getElementById('scanMsg');
          if(msg) msg.textContent = 'Encontrado: '+it.nombre;
          pushRecent(it.id);
          setTimeout(()=>{ showFicha(it.id); if(frame) frame.classList.remove('hit'); scanCooldown=false; }, 350);
        }
      }
    }
    scanRAF = requestAnimationFrame(tick);
  };
  scanRAF = requestAnimationFrame(tick);
}

function fechasConEntrega(){ return Object.keys(INGRESO_DATA).sort(); }
const LS_SALIDA = 'catalogo_maestro_salida_v1';
let SAL_DOSIF = {};
let SAL_STATE = {};
let SAL_DATE = null;
const SRV_ORD = ['DESAYUNO','ALMUERZO','CENA'];
function loadSalidaLS(){ try{ const r = localStorage.getItem(LS_SALIDA); if(r) SAL_STATE = JSON.parse(r); }catch(e){} }
function saveSalidaLS(){ localStorage.setItem(LS_SALIDA, JSON.stringify(SAL_STATE)); }
function salK(s,p,n){ return s+'||'+p+'||'+n; }
function salApsFor(d){
  const ps=[], day=SAL_DOSIF[d]||{};
  SRV_ORD.forEach(s=>{ if(!day[s]) return; Object.entries(day[s]).forEach(([p,prds])=>prds.forEach(pr=>ps.push({s,p,pr}))); });
  return ps;
}
function salIst(d,s,p,prod){
  const rec = SAL_STATE[d]?.items?.[salK(s,p,prod.n)]?.rec;
  return rec==null ? 'pend' : 'ok';
}
function salConfirmarOK(d,s,p,nb,cantidad){
  if(!SAL_STATE[d]) SAL_STATE[d] = {items:{}};
  const hora = new Date().toTimeString().slice(0,5);
  SAL_STATE[d].items[salK(s,p,nb)] = {rec: cantidad, hora};
  saveSalidaLS();
  pushEvento('salida_ok', {fecha:d, s, p, nb, cantidad, hora});
  logActividad('Salida confirmada: '+nb+' ('+p+') — '+cantidad);
  renderSalida();
  toast('Salida confirmada ('+hora+')');
}
function salDeshacer(d,s,p,nb){
  if(SAL_STATE[d]?.items?.[salK(s,p,nb)]) delete SAL_STATE[d].items[salK(s,p,nb)];
  saveSalidaLS();
  pushEvento('salida_undo', {fecha:d, s, p, nb});
  logActividad('Salida deshecha: '+nb);
  renderSalida();
  toast('Confirmacion deshecha');
}
function salShiftDate(dir){
  const dt = new Date((SAL_DATE||new Date().toISOString().slice(0,10))+'T12:00:00');
  dt.setDate(dt.getDate()+dir);
  SAL_DATE = dt.toISOString().slice(0,10);
  renderSalida();
}
function renderSalida(){
  if(!SAL_DATE) SAL_DATE = new Date().toISOString().slice(0,10);
  const ps = salApsFor(SAL_DATE);
  let h = `<div class="pgh"><div class="pgt">Salida a produccion</div><div class="pgd">Confirma el despacho de almacen a cocina segun la dosificacion del dia. Las cantidades ya estan establecidas.</div></div>`;
  h += `<div class="ing-datebar">
    <button class="ing-arrow" onclick="salShiftDate(-1)">&#8592;</button>
    <input type="date" value="${SAL_DATE}" onchange="SAL_DATE=this.value;renderSalida()">
    <button class="ing-arrow" onclick="salShiftDate(1)">&#8594;</button>
    <span class="tbc">${ps.length} producto${ps.length!==1?'s':''}</span>
  </div>`;
  if(!ps.length){
    h += `<div class="empty"><div class="ei2">&#128197;</div><div class="et">Sin dosificacion para este dia</div></div>`;
    document.getElementById('mainArea').innerHTML = h;
    return;
  }
  let okN=0, pendN=0;
  ps.forEach(({s,p,pr})=>{ if(salIst(SAL_DATE,s,p,pr)==='ok') okN++; else pendN++; });
  h += `<div class="bar"><span class="fc fok fa">&#10003; OK: ${okN}</span><span class="fc">Pendientes: ${pendN}</span><button class="fc fa" onclick="salExportCSV()">&#8659; Exportar CSV del dia</button></div>`;
  SRV_ORD.forEach(srv=>{
    const day = SAL_DOSIF[SAL_DATE]||{};
    if(!day[srv]) return;
    h += `<div class="sal-svc"><div class="sal-svc-hdr"><span>${srv}</span></div>`;
    Object.entries(day[srv]).forEach(([prep,prods])=>{
      h += `<div class="sal-prep"><div class="sal-prep-hdr">${ev(prep)}</div>`;
      prods.forEach(p=>{
        const st = salIst(SAL_DATE,srv,prep,p);
        const entry = SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n)];
        const rcls = st==='ok'?'rok':'';
        h += `<div class="ing-row ${rcls}" style="border-radius:0;border-left:none;border-right:none;margin-bottom:0;border-top:none">
          <div class="ing-info"><div class="ing-name">${ev(p.n)}</div><div class="ing-meta">Dosificado: ${p.c??''} ${ev(p.m||'')}${st==='ok'?` &middot; Hora: ${entry.hora||''}`:''}</div></div>
          ${st==='ok'
            ? `<span class="ing-badge ok">&#10003; OK</span><button class="undo" onclick="salDeshacer('${ev(SAL_DATE)}','${ev(srv)}','${ev(prep)}','${ev(p.n)}')">deshacer</button>`
            : `<button class="fc fok" onclick="salConfirmarOK('${ev(SAL_DATE)}','${ev(srv)}','${ev(prep)}','${ev(p.n)}',${p.c??0})">&#10003; OK</button>`}
        </div>`;
      });
      h += `</div>`;
    });
    h += `</div>`;
  });
  document.getElementById('mainArea').innerHTML = h;
}
function salExportCSV(){
  const ps = salApsFor(SAL_DATE);
  const rows = [];
  ps.forEach(({s,p,pr})=>{
    const it = SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n)];
    if(it?.rec==null) return;
    rows.push([SAL_DATE,s,'"'+p+'"','"'+pr.n+'"',pr.m||'',it.rec,it.hora||'']);
  });
  if(!rows.length){ toast('Sin registros para exportar'); return; }
  const lines = [['Fecha','Servicio','Preparacion','Producto','UM','Cantidad','Hora'].join(',')];
  rows.forEach(r=>lines.push(r.join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download = 'salida_'+SAL_DATE+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exportado: '+rows.length+' productos');
}
function nextFechaConEntrega(dir){
  const fechas = fechasConEntrega();
  if(!fechas.length) return ING_DATE;
  if(!ING_DATE) return fechas[0];
  if(dir>0){ const f = fechas.find(f=>f>ING_DATE); return f || fechas[fechas.length-1]; }
  else{ const rev=[...fechas].reverse(); const f = rev.find(f=>f<ING_DATE); return f || fechas[0]; }
}

function ingEntry(fecha, codigo){ return ING_STATE[fecha]?.items?.[codigo] || null; }
function ingConfirmarOK(fecha, codigo, uid){
  const v = parseFloat(document.getElementById('iq-'+uid)?.value);
  if(isNaN(v)||v<0){ toast('Ingresa una cantidad valida'); return; }
  if(!ING_STATE[fecha]) ING_STATE[fecha]={items:{}};
  const prev = ING_STATE[fecha].items[codigo];
  const hora = new Date().toTimeString().slice(0,5);
  const entry = {rec: v, state:'ok', horaOK: hora};
  if(prev && prev.state==='pendiente'){
    entry.fechaReposicion = new Date().toISOString().slice(0,10);
    entry.obs = prev.obs || '';
  }
  ING_STATE[fecha].items[codigo] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, codigo, entry});
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===codigo);
  logActividad('Ingreso confirmado: '+(infoIt?infoIt.nombre:codigo)+' — '+v+(entry.fechaReposicion?' (reposicion de faltante)':''));
  renderIngreso();
  toast('Ingreso confirmado ('+hora+')');
}
function ingMarcarPendiente(fecha, codigo){
  const obs = prompt('Observacion (opcional): motivo por el que no ingreso (rechazado, no lo trajo el proveedor, etc.)') || '';
  if(!ING_STATE[fecha]) ING_STATE[fecha]={items:{}};
  const entry = {rec:null, state:'pendiente', obs};
  ING_STATE[fecha].items[codigo] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, codigo, entry});
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===codigo);
  logActividad('Ingreso pendiente/faltante: '+(infoIt?infoIt.nombre:codigo));
  renderIngreso();
  toast('Marcado como pendiente / faltante');
}
function ingDeshacer(fecha, codigo){
  if(ING_STATE[fecha]?.items?.[codigo]) delete ING_STATE[fecha].items[codigo];
  saveIngresoLS();
  pushEvento('ingreso_undo', {fecha, codigo});
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===codigo);
  logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:codigo));
  renderIngreso();
  toast('Confirmacion deshecha');
}
function todosLosFaltantes(){
  const out = [];
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([codigo, entry])=>{
      if(entry.state==='pendiente' || entry.fechaReposicion){
        const info = (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===codigo);
        out.push({fecha, codigo, entry, nombre: info?info.nombre:codigo, proveedor: info?info.proveedor:'', esperado: info?info.cantidad:null, um: info?info.um:''});
      }
    });
  });
  out.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return out;
}

const CONF_KEY = 'catalogo_maestro_syncurl_v1';
let SYNC_URL = localStorage.getItem(CONF_KEY) || '';
let LAST_EVENT_IDS = new Set();
let LAST_SYNC_TIME = null;
let SYNC_BUSY = false;

function guardarSyncUrl(){
  const v = document.getElementById('syncUrlInput')?.value.trim();
  if(!v){ toast('Pega la URL del script primero'); return; }
  SYNC_URL = v;
  localStorage.setItem(CONF_KEY, SYNC_URL);
  toast('URL guardada, sincronizando...');
  pullEventos();
  renderSync();
}
function quitarSyncUrl(){
  SYNC_URL = '';
  localStorage.removeItem(CONF_KEY);
  renderSync();
  toast('Sincronizacion desactivada en este dispositivo');
}
async function pushEvento(tipo, payload){
  if(!SYNC_URL) return;
  const id = Date.now()+'_'+Math.random().toString(36).slice(2);
  LAST_EVENT_IDS.add(id);
  try{
    await fetch(SYNC_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({id, tipo, payload})
    });
  }catch(e){ console.error('sync push error', e); }
}
function aplicarEventoRemoto(tipo, p){
  if(tipo==='salida_ok'){
    if(!SAL_STATE[p.fecha]) SAL_STATE[p.fecha] = {items:{}};
    SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb)] = {rec:p.cantidad, hora:p.hora};
    saveSalidaLS();
    logActividad('Salida confirmada: '+p.nb+' ('+p.p+') — '+p.cantidad);
  } else if(tipo==='salida_undo'){
    if(SAL_STATE[p.fecha]?.items) delete SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb)];
    saveSalidaLS();
    logActividad('Salida deshecha: '+p.nb);
  } else if(tipo==='ingreso_set'){
    if(!ING_STATE[p.fecha]) ING_STATE[p.fecha] = {items:{}};
    ING_STATE[p.fecha].items[p.codigo] = p.entry;
    saveIngresoLS();
    const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.codigo===p.codigo);
    const nom = infoIt?infoIt.nombre:p.codigo;
    logActividad(p.entry.state==='ok' ? ('Ingreso confirmado: '+nom+' — '+p.entry.rec+(p.entry.fechaReposicion?' (reposicion de faltante)':'')) : ('Ingreso pendiente/faltante: '+nom));
  } else if(tipo==='ingreso_undo'){
    if(ING_STATE[p.fecha]?.items) delete ING_STATE[p.fecha].items[p.codigo];
    saveIngresoLS();
    const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.codigo===p.codigo);
    logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:p.codigo));
  } else if(tipo==='movimiento'){
    const arr = KARDEX[p.codigo] || (KARDEX[p.codigo] = []);
    if(!arr.some(m=>m._syncId===p.mov._syncId)){
      arr.unshift(p.mov);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad((p.mov.tipo==='devolucion'?'Devolucion registrada: ':'Pedido adicional: ')+(it?it.nombre:p.codigo)+' — '+p.mov.cantidad);
    }
    saveKardexLS();
  }
}
async function pullEventos(manual){
  if(!SYNC_URL || SYNC_BUSY) return;
  SYNC_BUSY = true;
  try{
    const res = await fetch(SYNC_URL+'?t='+Date.now());
    const data = await res.json();
    if(data.ok){
      let nuevos = 0;
      data.eventos.forEach(evt=>{
        if(LAST_EVENT_IDS.has(evt.id)) return;
        LAST_EVENT_IDS.add(evt.id);
        try{ aplicarEventoRemoto(evt.tipo, JSON.parse(evt.payload)); nuevos++; }catch(e){}
      });
      LAST_SYNC_TIME = new Date();
      if(nuevos>0) render(); else if(TAB==='sync') renderSync();
      if(manual) toast(nuevos>0 ? ('Sincronizado: '+nuevos+' evento(s) nuevo(s)') : 'Ya estaba al dia');
    }
  }catch(e){ console.error('sync pull error', e); if(manual) toast('Error de sincronizacion'); }
  SYNC_BUSY = false;
}
function renderPanel(){
  const hoy = new Date().toISOString().slice(0,10);
  const salHoy = salApsFor(hoy);
  const salOK = salHoy.filter(({s,p,pr})=>salIst(hoy,s,p,pr)==='ok').length;
  const ingHoy = INGRESO_DATA[hoy] || [];
  const ingOK = ingHoy.filter(it=>ingEntry(hoy,it.codigo)?.state==='ok').length;
  const ingPend = ingHoy.filter(it=>ingEntry(hoy,it.codigo)?.state==='pendiente').length;
  const faltantesAbiertos = todosLosFaltantes().filter(f=>f.entry.state==='pendiente').length;
  const movHoy = allMovimientos().filter(m=>m.fecha===hoy).length;

  let h = `<div class="pgh"><div class="pgt">Panel</div><div class="pgd">Vista general de lo que estan registrando las tablets, actualizada en tiempo real.</div></div>`;
  h += `<div class="panel-cards">
    <div class="panel-card"><div class="pc-num">${salOK}/${salHoy.length}</div><div class="pc-lbl">Salida confirmada hoy</div></div>
    <div class="panel-card"><div class="pc-num">${ingOK}/${ingHoy.length}</div><div class="pc-lbl">Ingreso confirmado hoy</div></div>
    <div class="panel-card ${faltantesAbiertos?'warn':''}"><div class="pc-num">${faltantesAbiertos}</div><div class="pc-lbl">Faltantes sin resolver</div></div>
    <div class="panel-card"><div class="pc-num">${movHoy}</div><div class="pc-lbl">Devoluciones/Adicionales hoy</div></div>
  </div>`;
  if(ingPend>0){
    h += `<div class="bar"><span class="fc" style="color:var(--dg);border-color:var(--dg)">&#9888; ${ingPend} producto(s) marcados pendiente/faltante hoy</span></div>`;
  }
  h += `<div class="sbl" style="margin:8px 0 8px">Actividad reciente</div>`;
  h += `<div class="card">`;
  if(!ACTIVITY_LOG.length){
    h += `<div class="ing-meta">Sin actividad registrada todavia.</div>`;
  } else {
    ACTIVITY_LOG.slice(0,40).forEach(a=>{
      const d = new Date(a.ts);
      const hora = isNaN(d) ? '' : d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
      h += `<div class="feed-item"><span class="feed-time">${hora}</span><span>${ev(a.resumen)}</span></div>`;
    });
  }
  h += `</div>`;
  document.getElementById('mainArea').innerHTML = h;
}
function renderSync(){
  let h = `<div class="pgh"><div class="pgt">Sincronizacion</div><div class="pgd">Comparte Salida, Ingreso, Devoluciones y Pedidos Adicionales con otros dispositivos en tiempo real.</div></div>`;
  h += `<div class="sync-card">
    <div><span class="sync-dot ${SYNC_URL?'on':'off'}"></span>${SYNC_URL ? 'Sincronizacion activa en este dispositivo' : 'Sin configurar en este dispositivo'}</div>
    ${LAST_SYNC_TIME ? `<div class="ing-meta" style="margin-top:6px">Ultima sincronizacion: ${LAST_SYNC_TIME.toLocaleTimeString()}</div>` : ''}
    <label style="font-family:var(--mn);font-size:10px;color:var(--mut);text-transform:uppercase;display:block;margin-top:14px">URL del script de Google (termina en /exec)</label>
    <input id="syncUrlInput" placeholder="https://script.google.com/macros/s/..../exec" value="${ev(SYNC_URL)}">
    <div class="dlg-actions">
      <button onclick="guardarSyncUrl()">Guardar y sincronizar</button>
      <button onclick="pullEventos(true)">Sincronizar ahora</button>
      ${SYNC_URL ? '<button onclick="quitarSyncUrl()">Desactivar</button>' : ''}
    </div>
    <div class="dlg-actions">
      <button onclick="probarConexion()">&#129514; Probar conexion (diagnostico)</button>
    </div>
    <div id="diagBox" style="margin-top:10px"></div>
  </div>`;
  document.getElementById('mainArea').innerHTML = h;
}
async function probarConexion(){
  const box = document.getElementById('diagBox');
  const url = document.getElementById('syncUrlInput')?.value.trim() || SYNC_URL;
  if(!url){ box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Pega la URL primero.</div>'; return; }
  box.innerHTML = '<div class="ing-meta">Probando...</div>';
  if(!url.includes('/exec')){
    box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>La URL no termina en /exec</b> — parece que pegaste la URL del editor de Apps Script en vez de la URL de la aplicacion web publicada. Ve a Implementar > Gestionar implementaciones para copiar la URL correcta.</div>`;
    return;
  }
  try{
    const res = await fetch(url+'?t='+Date.now());
    const status = res.status;
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(parsed && parsed.ok){
      box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Conexion exitosa.</b> El script respondio correctamente con ${parsed.eventos.length} evento(s) guardado(s) hasta ahora.</div>`;
    } else if(text.includes('Google Apps Script') && text.includes('sign in')){
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>El script pide iniciar sesion.</b> En la implementacion, el permiso "Quien tiene acceso" no esta puesto en "Cualquier usuario". Vuelve a Implementar > Gestionar implementaciones > editar (icono lapiz) > cambia el acceso y vuelve a implementar.</div>`;
    } else if(text.trim().startsWith('<')){
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>El script devolvio una pagina HTML en vez de datos</b> (status ${status}). Esto suele pasar si la implementacion no autorizo permisos, o si el codigo tiene un error. Revisa en Apps Script > Ejecuciones, para ver el detalle del error.</div>`;
    } else {
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)">Respuesta inesperada (status ${status}): ${ev(text.slice(0,200))}</div>`;
    }
  }catch(e){
    box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>No se pudo conectar.</b> Error: ${ev(e.message)}. Revisa que la URL este bien copiada y que tengas internet.</div>`;
  }
}
setInterval(()=>pullEventos(false), 20000);

async function init(){
  loadRecent();
  loadIngresoLS();
  loadKardexLS();
  loadSalidaLS();
  loadActivityLog();
  try{ INGRESO_DATA = await decompressB64(INGRESO_B64); }catch(e){ console.error('No se pudo cargar cronograma de ingreso', e); }
  try{ SAL_DOSIF = await decompressB64(SAL_DOSIF_B64); }catch(e){ console.error('No se pudo cargar dosificacion de salida', e); }
  render();
  if(SYNC_URL) pullEventos(false);
}
init();
</script>
